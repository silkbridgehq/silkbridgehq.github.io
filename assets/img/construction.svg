<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of construction and site supplies: hard hat, hi-vis vest, traffic cones, tape measure and spanner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EEDF"/><stop offset="1" stop-color="#E6EBF3"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7C65A"/><stop offset="1" stop-color="#C9A227"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A4A7E"/><stop offset="1" stop-color="#14284B"/></linearGradient>
  </defs>
  <style>*{transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-22px)}}.hat{animation:float 4s ease-in-out infinite}.cone{transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}.c2{animation-delay:-2.5s}.vest{transform-origin:50% 0;animation:sway 6s ease-in-out infinite}.tape{animation:float 5s ease-in-out infinite 1s}</style>
  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 455 L800 435 L800 600 L0 600 Z" fill="#D9D2BF"/>

  <line x1="200" y1="0" x2="200" y2="70" stroke="#14284B" stroke-width="3"/>
  <g class="vest"><path d="M160 70 Q200 60 240 70 L250 90 L290 110 L290 330 L110 330 L110 110 L150 90 Z" fill="#F2B21B"/><path d="M175 75 L200 150 L225 75" stroke="#14284B" stroke-width="4" fill="none"/><rect x="110" y="220" width="180" height="20" fill="#E8ECF4"/><rect x="110" y="270" width="180" height="20" fill="#E8ECF4"/><line x1="200" y1="150" x2="200" y2="330" stroke="#C98F0F" stroke-width="3"/></g>
  <g class="hat"><path d="M380 300 Q380 210 470 205 Q560 210 560 300 Z" fill="url(#gold)"/><rect x="355" y="296" width="230" height="20" rx="10" fill="#B08D1E"/><rect x="458" y="210" width="24" height="88" rx="10" fill="#F0D57A" opacity=".8"/><path d="M405 270 Q415 235 450 225" stroke="#fff" stroke-width="6" fill="none" opacity=".45" stroke-linecap="round"/></g>
  <g class="cone"><path d="M620 470 L660 320 L700 470 Z" fill="#E8692B"/><path d="M641 395 L679 395 L688 430 L632 430 Z" fill="#fff"/><rect x="600" y="465" width="120" height="16" rx="5" fill="#14284B"/></g>
  <g class="cone c2"><path d="M705 470 L735 365 L765 470 Z" fill="#E8692B"/><path d="M721 418 L749 418 L755 440 L715 440 Z" fill="#fff"/><rect x="690" y="465" width="90" height="13" rx="5" fill="#14284B"/></g>
  <g class="tape"><rect x="380" y="380" width="110" height="100" rx="24" fill="url(#navy)"/><circle cx="435" cy="430" r="26" fill="#22406F"/><circle cx="435" cy="430" r="9" fill="#C9A227"/><path d="M490 460 L590 460 L590 476 L490 476 Z" fill="#E7C65A"/><g stroke="#14284B" stroke-width="2"><line x1="505" y1="460" x2="505" y2="468"/><line x1="520" y1="460" x2="520" y2="472"/><line x1="535" y1="460" x2="535" y2="468"/><line x1="550" y1="460" x2="550" y2="472"/><line x1="565" y1="460" x2="565" y2="468"/><line x1="580" y1="460" x2="580" y2="472"/></g></g>
  <g transform="rotate(-25 230 440)"><rect x="140" y="430" width="170" height="20" rx="10" fill="#8C9AB3"/><circle cx="130" cy="440" r="30" fill="#8C9AB3"/><path d="M100 440 l26 -12 v24 z" fill="#E6EBF3"/><circle cx="310" cy="440" r="22" fill="#8C9AB3"/><circle cx="310" cy="440" r="10" fill="#E6EBF3"/></g>
</svg>
