<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of fitness gear: dumbbells, kettlebell, yoga mat, water bottle and skipping rope">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFE9DD"/><stop offset="1" stop-color="#E3EAF4"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7C65A"/><stop offset="1" stop-color="#C9A227"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A4A7E"/><stop offset="1" stop-color="#14284B"/></linearGradient>
  </defs>
  <style>*{transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-22px)}}.bell{transform-origin:50% 0;animation:sway 3.5s ease-in-out infinite}.db{animation:float 3s ease-in-out infinite}.db2{animation-delay:-1.5s}.rope{animation:float 4s ease-in-out infinite .6s}</style>
  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 455 L800 435 L800 600 L0 600 Z" fill="#E2DAC6"/>

  <rect x="90" y="360" width="250" height="90" rx="45" fill="url(#navy)"/>
  <ellipse cx="340" cy="405" rx="26" ry="45" fill="#22406F"/><ellipse cx="340" cy="405" rx="14" ry="26" fill="#14284B"/>
  <rect x="150" y="360" width="16" height="90" fill="#C9A227"/><rect x="260" y="360" width="16" height="90" fill="#C9A227"/>
  <line x1="560" y1="0" x2="560" y2="80" stroke="#14284B" stroke-width="3"/>
  <g class="bell"><path d="M525 80 Q525 40 560 40 Q595 40 595 80" stroke="#14284B" stroke-width="14" fill="none"/><circle cx="560" cy="150" r="72" fill="url(#gold)"/><path d="M515 120 Q530 95 560 92" stroke="#fff" stroke-width="7" fill="none" opacity=".4" stroke-linecap="round"/><text x="560" y="168" font-family="Arial, sans-serif" font-weight="700" font-size="40" text-anchor="middle" fill="#14284B">16</text></g>
  <g class="db"><rect x="430" y="390" width="160" height="16" rx="8" fill="#14284B"/><rect x="420" y="360" width="30" height="76" rx="8" fill="url(#navy)"/><rect x="570" y="360" width="30" height="76" rx="8" fill="url(#navy)"/><rect x="404" y="370" width="18" height="56" rx="6" fill="#22406F"/><rect x="598" y="370" width="18" height="56" rx="6" fill="#22406F"/></g>
  <g class="db db2"><rect x="470" y="300" width="120" height="12" rx="6" fill="#14284B"/><rect x="460" y="280" width="24" height="52" rx="6" fill="url(#gold)"/><rect x="576" y="280" width="24" height="52" rx="6" fill="url(#gold)"/></g>
  <g class="rope"><path d="M640 250 C 760 260, 760 380, 680 430 S 600 500, 700 520" stroke="#C9A227" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="626" y="225" width="22" height="44" rx="10" fill="#14284B"/><rect x="694" y="510" width="44" height="20" rx="10" fill="#14284B"/></g>
  <rect x="200" y="250" width="56" height="110" rx="18" fill="#F7F3E8" stroke="#14284B" stroke-width="3"/><rect x="214" y="232" width="28" height="22" rx="6" fill="#14284B"/><rect x="200" y="290" width="56" height="26" fill="#C9A227"/>
</svg>
