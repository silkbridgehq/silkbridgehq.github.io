<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of pet products: round pet bed, ball, chew toy, lead and bowl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EEDF"/><stop offset="1" stop-color="#EFE3E0"/></linearGradient>
    <radialGradient id="cushion" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#F0D57A"/><stop offset="1" stop-color="#C9A227"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A4A7E"/><stop offset="1" stop-color="#14284B"/></linearGradient>
  </defs>
  <style>*{transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.ball{animation:bounce 1.8s cubic-bezier(.5,0,.5,1) infinite}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-60px)}}.bone{transform-origin:50% 50%;animation:wig 3.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:rotate(0)}}.lead{transform-origin:20% 0;animation:sway 5s ease-in-out infinite}@keyframes sway{50%{transform:rotate(4deg)}}.paws{animation:paw 4s ease-in-out infinite}@keyframes paw{50%{opacity:.5}}</style>
  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 440 L800 420 L800 600 L0 600 Z" fill="#E8DCCB"/>
  <!-- paw prints -->
  <g fill="#14284B" opacity=".08">
    <g transform="translate(90 120) rotate(-20)"><ellipse cx="0" cy="0" rx="18" ry="15"/><circle cx="-16" cy="-20" r="7"/><circle cx="-4" cy="-27" r="7"/><circle cx="10" cy="-26" r="7"/><circle cx="20" cy="-16" r="7"/></g>
    <g transform="translate(170 70) rotate(-20)"><ellipse cx="0" cy="0" rx="18" ry="15"/><circle cx="-16" cy="-20" r="7"/><circle cx="-4" cy="-27" r="7"/><circle cx="10" cy="-26" r="7"/><circle cx="20" cy="-16" r="7"/></g>
    <g transform="translate(690 110) rotate(15)"><ellipse cx="0" cy="0" rx="18" ry="15"/><circle cx="-16" cy="-20" r="7"/><circle cx="-4" cy="-27" r="7"/><circle cx="10" cy="-26" r="7"/><circle cx="20" cy="-16" r="7"/></g>
  </g>
  <ellipse cx="380" cy="505" rx="260" ry="34" fill="#14284B" opacity=".09"/>
  <!-- pet bed -->
  <ellipse cx="380" cy="430" rx="250" ry="88" fill="url(#rim)"/>
  <ellipse cx="380" cy="392" rx="250" ry="88" fill="#22406F"/>
  <ellipse cx="380" cy="400" rx="190" ry="60" fill="url(#cushion)"/>
  <path d="M215 395 Q380 440 545 395" stroke="#B08D1E" stroke-width="3" fill="none" opacity=".6"/>
  <g stroke="#fff" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity=".35" fill="none"><ellipse cx="380" cy="392" rx="228" ry="78"/></g>
  <g class="bone"><!-- bone toy on bed -->
  <g transform="translate(380 395) rotate(-12)">
    <rect x="-60" y="-11" width="120" height="22" rx="11" fill="#fff"/>
    <circle cx="-62" cy="-12" r="15" fill="#fff"/><circle cx="-62" cy="12" r="15" fill="#fff"/>
    <circle cx="62" cy="-12" r="15" fill="#fff"/><circle cx="62" cy="12" r="15" fill="#fff"/>
  </g>
  </g>
  <!-- ball -->
  <g class="ball"><circle cx="670" cy="455" r="42" fill="#C9A227"/>
  <path d="M632 440 Q670 470 708 440 M635 475 Q670 445 705 475" stroke="#fff" stroke-width="5" fill="none" opacity=".9"/>
  </g>
  <!-- bowl -->
  <g transform="translate(110 470)">
    <path d="M-60 -30 L60 -30 L44 20 L-44 20 Z" fill="#14284B"/>
    <ellipse cx="0" cy="-30" rx="60" ry="14" fill="#2A4A7E"/>
    <ellipse cx="0" cy="-30" rx="46" ry="9" fill="#9BB1D1"/>
  </g>
  <!-- lead -->
  <g class="lead"><path d="M600 140 C 720 150, 720 260, 640 270 S 540 330, 610 380" stroke="#C9A227" stroke-width="10" fill="none" stroke-linecap="round"/>
  <rect x="582" y="120" width="40" height="28" rx="12" fill="#14284B"/>
  <circle cx="612" cy="384" r="12" fill="none" stroke="#14284B" stroke-width="6"/>
</g>
  </svg>
