<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of commercial furniture: lounge chair, cafe table and chairs, pendant lamp">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EEDF"/><stop offset="1" stop-color="#E6EBF3"/></linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7C65A"/><stop offset="1" stop-color="#C9A227"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22406F"/><stop offset="1" stop-color="#14284B"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6D6" stop-opacity=".9"/><stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/></radialGradient>
  </defs>
  <style>*{transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.lamp{transform-origin:50% 0;animation:swing 5s ease-in-out infinite}@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.plant{transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}@keyframes sway{50%{transform:rotate(2deg)}}.steam{animation:steam 3s ease-in-out infinite}@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-16px)}}</style>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- wall panel + window -->
  <rect x="470" y="70" width="250" height="300" rx="18" fill="#fff" opacity=".7"/>
  <rect x="490" y="90" width="100" height="260" rx="10" fill="#D7E0EC"/>
  <rect x="600" y="90" width="100" height="260" rx="10" fill="#D7E0EC"/>
  <!-- floor -->
  <path d="M0 455 L800 430 L800 600 L0 600 Z" fill="#E9E2CF"/>
  <ellipse cx="250" cy="510" rx="190" ry="26" fill="#14284B" opacity=".08"/>
  <ellipse cx="590" cy="500" rx="150" ry="20" fill="#14284B" opacity=".08"/>
  <!-- pendant lamp -->
  <g class="lamp"><line x1="590" y1="0" x2="590" y2="150" stroke="#14284B" stroke-width="3"/>
  <circle cx="590" cy="190" r="70" fill="url(#glow)"/>
  <path d="M550 175 Q590 120 630 175 Z" fill="#14284B"/>
  <rect x="550" y="172" width="80" height="6" rx="3" fill="#C9A227"/>
  </g>
  <!-- lounge chair -->
  <path d="M120 300 Q120 230 190 230 L300 230 Q370 230 370 300 L370 400 L120 400 Z" fill="url(#navy)"/>
  <rect x="100" y="360" width="290" height="70" rx="26" fill="url(#seat)"/>
  <rect x="140" y="330" width="210" height="50" rx="20" fill="#E7C65A"/>
  <rect x="88" y="320" width="44" height="110" rx="22" fill="#1B355E"/>
  <rect x="358" y="320" width="44" height="110" rx="22" fill="#1B355E"/>
  <path d="M130 428 L112 505 M360 428 L378 505" stroke="#14284B" stroke-width="9" stroke-linecap="round"/>
  <!-- cafe table -->
  <ellipse cx="590" cy="352" rx="95" ry="18" fill="#14284B"/>
  <ellipse cx="590" cy="346" rx="95" ry="18" fill="#F7F3E8"/>
  <rect x="584" y="360" width="12" height="120" fill="#14284B"/>
  <ellipse cx="590" cy="485" rx="48" ry="10" fill="#14284B"/>
  <!-- cup + vase -->
  <path class="steam" d="M556 312 q-6 -10 0 -20 q6 -10 0 -20" stroke="#14284B" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".5"/>
  <rect x="548" y="318" width="22" height="24" rx="5" fill="#fff" stroke="#14284B" stroke-width="3"/>
  <path d="M618 340 Q610 300 625 290 Q640 300 632 340 Z" fill="#C9A227"/>
  <path d="M625 292 Q620 260 600 250 M626 292 Q640 262 660 258" stroke="#2F6B4F" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- cafe chairs -->
  <g>
    <rect x="452" y="300" width="14" height="110" rx="7" fill="#14284B"/>
    <rect x="452" y="400" width="88" height="14" rx="7" fill="#C9A227"/>
    <path d="M462 412 L456 490 M532 412 L538 490" stroke="#14284B" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="714" y="300" width="14" height="110" rx="7" fill="#14284B"/>
    <rect x="640" y="400" width="88" height="14" rx="7" fill="#C9A227"/>
    <path d="M648 412 L642 490 M718 412 L724 490" stroke="#14284B" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- plant -->
  <g class="plant"><path d="M40 470 L80 470 L74 540 L46 540 Z" fill="#14284B"/>
  <path d="M60 470 Q30 400 50 360 M60 470 Q70 390 100 370 M60 470 Q60 410 40 410" stroke="#2F6B4F" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="50" cy="360" rx="12" ry="20" fill="#3E8A64"/>
  <ellipse cx="100" cy="370" rx="12" ry="20" fill="#3E8A64" transform="rotate(30 100 370)"/>
  <ellipse cx="40" cy="410" rx="10" ry="16" fill="#3E8A64" transform="rotate(-30 40 410)"/>
</g>
  </svg>
