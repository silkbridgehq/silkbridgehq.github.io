<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of branded merchandise and workwear: t-shirt with logo, cap, tote bag, mug and polo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EEF5"/><stop offset="1" stop-color="#F3EEDF"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7C65A"/><stop offset="1" stop-color="#C9A227"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A4A7E"/><stop offset="1" stop-color="#14284B"/></linearGradient>
  </defs>
  <style>*{transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-22px)}}.tee{transform-origin:50% 0;animation:sway 6s ease-in-out infinite}.cap{animation:float 4s ease-in-out infinite}.tote{transform-origin:50% 0;animation:sway 5s ease-in-out infinite -2s}</style>
  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 455 L800 435 L800 600 L0 600 Z" fill="#DCE3EE"/>

  <rect x="80" y="60" width="640" height="10" rx="5" fill="#14284B"/>
  <g class="tee"><path d="M300 70 L300 95 M270 110 L300 92 L330 110" stroke="#8C9AB3" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M230 120 L270 105 Q300 125 330 105 L370 120 L420 170 L385 205 L360 185 L360 380 L240 380 L240 185 L215 205 L180 170 Z" fill="url(#navy)"/>
  <path d="M272 250 Q300 205 328 250" stroke="#E7C65A" stroke-width="5" fill="none" stroke-linecap="round"/><line x1="265" y1="252" x2="335" y2="252" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M272 262 Q286 257 300 262 T328 262" stroke="#8C9AB3" stroke-width="3" fill="none"/></g>
  <g class="tote"><path d="M520 70 L520 100" stroke="#8C9AB3" stroke-width="5"/><path d="M490 170 Q490 105 520 105 Q550 105 550 170" stroke="#C9A227" stroke-width="7" fill="none"/>
  <rect x="455" y="160" width="130" height="160" rx="8" fill="#F7F3E8" stroke="#14284B" stroke-width="3"/><text x="520" y="250" font-family="Georgia, serif" font-style="italic" font-size="26" text-anchor="middle" fill="#14284B">your</text><text x="520" y="280" font-family="Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="3" text-anchor="middle" fill="#C9A227">LOGO</text></g>
  <g class="cap"><path d="M560 450 Q560 380 625 376 Q690 380 690 450 Z" fill="url(#gold)"/><path d="M680 445 Q740 445 760 462 L690 462 Z" fill="#B08D1E"/><circle cx="625" cy="378" r="7" fill="#B08D1E"/><path d="M600 425 Q625 400 650 425" stroke="#14284B" stroke-width="3" fill="none"/></g>
  <rect x="150" y="410" width="80" height="86" rx="14" fill="#fff" stroke="#14284B" stroke-width="3"/><path d="M230 428 q30 0 30 22 q0 22 -30 22" stroke="#14284B" stroke-width="7" fill="none"/><path d="M168 460 Q190 432 212 460" stroke="#C9A227" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M320 440 L460 440 L470 500 L310 500 Z" fill="#22406F"/><path d="M360 440 L390 465 L420 440" stroke="#E7C65A" stroke-width="4" fill="none"/>
</svg>
