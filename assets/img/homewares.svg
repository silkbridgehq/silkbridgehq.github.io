<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of homewares and kitchenware: shelf with vases, stacked plates, cooking pot and mugs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EEDF"/><stop offset="1" stop-color="#E9EEF5"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7C65A"/><stop offset="1" stop-color="#C9A227"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A4A7E"/><stop offset="1" stop-color="#14284B"/></linearGradient>
  </defs>
  <style>*{transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-22px)}}.steam{animation:steam 3.2s ease-in-out infinite}.s2{animation-delay:1.1s}.vase{transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}.plates{animation:float 5s ease-in-out infinite}</style>
  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 455 L800 435 L800 600 L0 600 Z" fill="#E6DECB"/>

  <rect x="80" y="150" width="400" height="14" rx="4" fill="#14284B"/>
  <rect x="100" y="164" width="10" height="40" fill="#14284B"/><rect x="450" y="164" width="10" height="40" fill="#14284B"/>
  <g class="vase"><path d="M130 150 Q112 110 135 80 L150 80 Q172 110 155 150 Z" fill="url(#gold)"/><path d="M142 80 Q136 50 120 35 M143 80 Q155 48 172 40" stroke="#2F6B4F" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="120" cy="35" rx="8" ry="13" fill="#3E8A64"/><ellipse cx="172" cy="40" rx="8" ry="13" fill="#3E8A64"/></g>
  <rect x="200" y="96" width="44" height="54" rx="20" fill="#F7F3E8" stroke="#14284B" stroke-width="3"/>
  <path d="M290 150 L300 100 L350 100 L360 150 Z" fill="url(#navy)"/>
  <circle cx="410" cy="125" r="25" fill="#F7F3E8" stroke="#C9A227" stroke-width="4"/>
  <g class="plates">
    <ellipse cx="560" cy="300" rx="110" ry="22" fill="#14284B"/><ellipse cx="560" cy="292" rx="110" ry="22" fill="#F7F3E8"/>
    <ellipse cx="560" cy="276" rx="110" ry="22" fill="#14284B"/><ellipse cx="560" cy="268" rx="110" ry="22" fill="#F7F3E8"/>
    <ellipse cx="560" cy="252" rx="110" ry="22" fill="#14284B"/><ellipse cx="560" cy="244" rx="110" ry="22" fill="#FFFFFF"/>
    <ellipse cx="560" cy="244" rx="70" ry="13" fill="none" stroke="#C9A227" stroke-width="3"/>
  </g>
  <path class="steam" d="M250 300 q-8 -14 0 -28 q8 -14 0 -28" stroke="#14284B" stroke-width="3" fill="none" stroke-linecap="round" opacity=".45"/>
  <path class="steam s2" d="M300 300 q-8 -14 0 -28 q8 -14 0 -28" stroke="#14284B" stroke-width="3" fill="none" stroke-linecap="round" opacity=".45"/>
  <rect x="180" y="330" width="200" height="130" rx="22" fill="url(#navy)"/>
  <rect x="168" y="318" width="224" height="24" rx="12" fill="#22406F"/>
  <rect x="262" y="300" width="36" height="16" rx="8" fill="url(#gold)"/>
  <rect x="140" y="360" width="40" height="14" rx="7" fill="#14284B"/><rect x="380" y="360" width="40" height="14" rx="7" fill="#14284B"/>
  <rect x="500" y="380" width="70" height="80" rx="14" fill="url(#gold)"/><path d="M570 400 q30 0 30 22 q0 22 -30 22" stroke="#C9A227" stroke-width="9" fill="none"/>
  <rect x="620" y="395" width="62" height="66" rx="12" fill="#F7F3E8" stroke="#14284B" stroke-width="3"/><path d="M682 410 q24 0 24 18 q0 18 -24 18" stroke="#14284B" stroke-width="6" fill="none"/>
</svg>
